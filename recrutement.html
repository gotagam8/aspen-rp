<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASPEN RP - Recrutement IA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #07070a;
            --bg-card: #0b0c14;
            --accent-pink: #f72585;
            --secondary-neon: #00f5d4;
            --purple-glow: #3b1747;
        }

        body { background-color: var(--bg-dark); color: white; font-family: 'Rajdhani', sans-serif; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        
        .header-bar { background: rgba(10, 10, 15, 0.95); border-bottom: 2px solid var(--accent-pink); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .header-logo { height: 38px; width: auto; object-fit: contain; }

        .chat-container { background: var(--bg-card); border: 2px solid var(--purple-glow); border-radius: 15px; max-width: 650px; margin: 30px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(247, 37, 133, 0.15); }
        .chat-header { background: rgba(15, 17, 26, 0.95); padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 12px; }
        .chat-header i { font-size: 1.5rem; color: var(--secondary-neon); }
        
        .chat-messages { height: 380px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #07080e; }
        
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 1rem; line-height: 1.4; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .message.bot { background: #121526; border-left: 3px solid var(--secondary-neon); color: #e2e8f0; align-self: flex-start; }
        .message.user { background: var(--accent-pink); color: white; align-self: flex-end; }

        .chat-input-area { padding: 15px 20px; background: var(--bg-card); border-top: 1px solid rgba(255,255,255,0.05); display: flex; gap: 10px; }
        .chat-input-area input { background: #07080e; border: 1px solid var(--purple-glow); color: white; border-radius: 8px; padding: 10px 15px; flex-grow: 1; font-family: 'Rajdhani', sans-serif; font-size: 1.05rem; }
        .chat-input-area input:focus { outline: none; border-color: var(--secondary-neon); box-shadow: 0 0 10px rgba(0, 245, 212, 0.2); }
        
        .btn-send { background: var(--secondary-neon); border: none; color: #07070a; font-weight: bold; border-radius: 8px; padding: 0 20px; transition: 0.2s; }
        .btn-send:hover { background: #00c4aa; box-shadow: 0 0 12px rgba(0, 245, 212, 0.4); }

        .nav-mode-btn { background: transparent; border: 1px solid var(--accent-pink); color: white; font-family: 'Orbitron', sans-serif; padding: 6px 18px; border-radius: 20px; font-size: 0.85rem; transition: 0.3s; }
        .nav-mode-btn.active, .nav-mode-btn:hover { background: var(--accent-pink); box-shadow: 0 0 15px rgba(247, 37, 133, 0.4); }

        footer { text-align: center; padding: 20px; background: rgba(8, 9, 14, 0.95); border-top: 1px solid rgba(255, 255, 255, 0.05); color: #64748b; font-size: 0.85rem; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div>
        <div class="header-bar">
            <div class="d-flex align-items-center gap-3">
                <a href="index.html">
                    <img src="logo.png" alt="ASPEN RP" class="header-logo" style="height: 38px; width: auto;">
                </a>
            </div>
            <div class="d-flex align-items-center gap-3">
                <a href="index.html" class="btn btn-outline-light btn-sm font-orbitron">Retour au site</a>
            </div>
        </div>

        <div class="container py-4">
            <div class="text-center mb-4">
                <h2 class="font-orbitron fw-bold" style="color: var(--secondary-neon);"><i class="fa-solid fa-robot me-2"></i>RECRUTEMENT IA</h2>
                <div class="d-flex justify-content-center gap-3 mt-3">
                    <button class="nav-mode-btn active" id="btnModePostuler" onclick="switchMode('postuler')">Postuler</button>
                    <button class="nav-mode-btn" id="btnModeSuivi" onclick="switchMode('suivi')">Suivre ma candidature</button>
                </div>
            </div>

            <div class="chat-container" id="chatContainer">
                <div class="chat-header">
                    <i class="fa-solid fa-microchip"></i>
                    <h5 class="font-orbitron mb-0 text-white">Assistant IA ASPEN</h5>
                </div>
                
                <div class="chat-messages" id="chatBox"></div>
                
                <div class="chat-input-area">
                    <input type="text" id="userInput" placeholder="Écris ta réponse ici..." onkeypress="handleKeyPress(event)">
                    <button class="btn-send font-orbitron" onclick="sendMessage()">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p class="mb-0">&copy; 2026 ASPEN RP — TOUS DROITS RÉSERVÉS</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentMode = 'postuler';
        let applicationStep = 0;
        let candidateData = { discord: '', poste: '', motivations: '' };
        let liveCheckInterval = null; 
        let lastMsgCount = 0;

        document.addEventListener('DOMContentLoaded', () => {
            switchMode('postuler');
            
            // Écouteur en direct sur le même navigateur
            window.addEventListener('storage', () => {
                if (currentMode === 'suivi' && candidateData.discord) {
                    refreshSuiviMessages();
                }
            });
        });

        function stopAutoCheck() {
            if (liveCheckInterval) {
                clearInterval(liveCheckInterval);
                liveCheckInterval = null;
            }
        }

        function switchMode(mode) {
            stopAutoCheck();
            currentMode = mode;
            applicationStep = 0;
            candidateData = { discord: '', poste: '', motivations: '' };
            lastMsgCount = 0;

            document.getElementById('btnModePostuler').classList.toggle('active', mode === 'postuler');
            document.getElementById('btnModeSuivi').classList.toggle('active', mode === 'suivi');

            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = '';

            if (mode === 'postuler') {
                addMessage("Bonjour ! Je suis l'assistant de recrutement ASPEN. Quel est ton pseudo Discord ?", 'bot');
            } else {
                addMessage("Bonjour ! Entre ton pseudo Discord pour consulter l'état et la discussion de ta candidature.", 'bot');
            }
        }

        function addMessage(text, sender) {
            const chatBox = document.getElementById('chatBox');
            const msg = document.createElement('div');
            msg.className = `message ${sender}`;
            msg.innerText = text;
            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const val = input.value.trim();
            if (!val) return;

            addMessage(val, 'user');
            input.value = '';

            if (currentMode === 'postuler') {
                processPostulation(val);
            } else {
                processSuivi(val);
            }
        }

        function processPostulation(val) {
            if (applicationStep === 0) {
                candidateData.discord = val;
                applicationStep = 1;
                addMessage(`Parfait, ${val}. Quel poste souhaites-tu occuper dans le staff/serveur ?`, 'bot');
            } else if (applicationStep === 1) {
                candidateData.poste = val;
                applicationStep = 2;
                addMessage("Très bien. Quelles sont tes motivations pour rejoindre le projet ASPEN ?", 'bot');
            } else if (applicationStep === 2) {
                candidateData.motivations = val;
                applicationStep = 3;

                // Enregistrement dans LocalStorage
                let list = JSON.parse(localStorage.getItem('aspen_candidatures') || '[]');
                list.push({
                    discord: candidateData.discord,
                    poste: candidateData.poste,
                    motivations: candidateData.motivations,
                    status: 'En attente',
                    messages: []
                });
                localStorage.setItem('aspen_candidatures', JSON.stringify(list));

                addMessage("✅ Ta candidature a été envoyée avec succès au Staff ! Tu peux basculer sur l'onglet 'Suivre ma candidature' pour échanger avec eux.", 'bot');
            }
        }

        function processSuivi(val) {
            let list = JSON.parse(localStorage.getItem('aspen_candidatures') || '[]');

            // Si le pseudo n'est pas encore sélectionné
            if (!candidateData.discord) {
                let index = list.findIndex(item => item.discord.toLowerCase() === val.toLowerCase());
                if (index === -1) {
                    addMessage("❌ Aucune candidature n'a été trouvée pour ce pseudo Discord. Vérifie l'orthographe.", 'bot');
                } else {
                    candidateData.discord = list[index].discord;
                    document.getElementById('chatBox').innerHTML = ''; // Nettoie
                    addMessage(`Bienvenue ${candidateData.discord}. Statut de ton dossier : [ ${list[index].status || 'En attente'} ]`, 'bot');

                    refreshSuiviMessages();

                    // Active la vérification automatique en arrière-plan
                    stopAutoCheck();
                    liveCheckInterval = setInterval(refreshSuiviMessages, 1000);
                }
            } else {
                // Envoi d'un message au staff
                let index = list.findIndex(item => item.discord.toLowerCase() === candidateData.discord.toLowerCase());
                if (index !== -1) {
                    if (!list[index].messages) list[index].messages = [];

                    const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    list[index].messages.push({
                        sender: candidateData.discord,
                        date: now,
                        text: val
                    });
                    localStorage.setItem('aspen_candidatures', JSON.stringify(list));
                    refreshSuiviMessages();
                }
            }
        }

        function refreshSuiviMessages() {
            if (!candidateData.discord) return;

            let list = JSON.parse(localStorage.getItem('aspen_candidatures') || '[]');
            let candidate = list.find(item => item.discord.toLowerCase() === candidateData.discord.toLowerCase());
            if (!candidate) return;

            const chatBox = document.getElementById('chatBox');
            let msgs = candidate.messages || [];

            // Met à jour l'affichage uniquement si de nouveaux messages sont détectés
            if (msgs.length !== lastMsgCount) {
                chatBox.innerHTML = '';
                addMessage(`Statut actuel de ta candidature : [ ${candidate.status || 'En attente'} ]`, 'bot');

                msgs.forEach(m => {
                    const isUser = m.sender.toLowerCase() === candidateData.discord.toLowerCase();
                    addMessage(`[${m.sender}] : ${m.text}`, isUser ? 'user' : 'bot');
                });

                lastMsgCount = msgs.length;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
    </script>
</body>
</html>
