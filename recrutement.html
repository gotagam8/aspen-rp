<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASPEN RP - Recrutement IA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #07070a;
            --bg-card: #0b0c14;
            --accent-pink: #f72585;
            --secondary-neon: #00f5d4;
            --purple-glow: #3b1747;
        }

        body { background-color: var(--bg-dark); color: white; font-family: 'Rajdhani', sans-serif; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        
        .header-bar { background: rgba(10, 10, 15, 0.95); border-bottom: 2px solid var(--accent-pink); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .header-logo { height: 38px; width: auto; object-fit: contain; }

        .chat-container { background: var(--bg-card); border: 2px solid var(--purple-glow); border-radius: 15px; max-width: 650px; margin: 30px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(247, 37, 133, 0.15); }
        .chat-header { background: rgba(15, 17, 26, 0.95); padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 12px; }
        .chat-header i { font-size: 1.5rem; color: var(--secondary-neon); }
        
        .chat-messages { height: 380px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #07080e; }
        
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 1rem; line-height: 1.4; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .message.bot { background: #121526; border-left: 3px solid var(--secondary-neon); color: #e2e8f0; align-self: flex-start; }
        .message.user { background: var(--accent-pink); color: white; align-self: flex-end; }

        .chat-input-area { padding: 15px 20px; background: var(--bg-card); border-top: 1px solid rgba(255,255,255,0.05); display: flex; gap: 10px; }
        .chat-input-area input { background: #07080e; border: 1px solid var(--purple-glow); color: white; border-radius: 8px; padding: 10px 15px; flex-grow: 1; font-family: 'Rajdhani', sans-serif; font-size: 1.05rem; }
        .chat-input-area input:focus { outline: none; border-color: var(--secondary-neon); box-shadow: 0 0 10px rgba(0, 245, 212, 0.2); }
        
        .btn-send { background: var(--secondary-neon); border: none; color: #07070a; font-weight: bold; border-radius: 8px; padding: 0 20px; transition: 0.2s; }
        .btn-send:hover { background: #00c4aa; box-shadow: 0 0 12px rgba(0, 245, 212, 0.4); }

        .nav-mode-btn { background: transparent; border: 1px solid var(--accent-pink); color: white; font-family: 'Orbitron', sans-serif; padding: 6px 18px; border-radius: 20px; font-size: 0.85rem; transition: 0.3s; }
        .nav-mode-btn.active, .nav-mode-btn:hover { background: var(--accent-pink); box-shadow: 0 0 15px rgba(247, 37, 133, 0.4); }

        footer { text-align: center; padding: 20px; background: rgba(8, 9, 14, 0.95); border-top: 1px solid rgba(255, 255, 255, 0.05); color: #64748b; font-size: 0.85rem; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div>
        <div class="header-bar">
            <div class="d-flex align-items-center gap-3">
                <a href="index.html">
                    <img src="logo.png" alt="ASPEN RP" class="header-logo" style="height: 38px; width: auto;">
                </a>
            </div>
            <div class="d-flex align-items-center gap-3">
                <a href="index.html" class="btn btn-outline-light btn-sm font-orbitron">Retour au site</a>
            </div>
        </div>

        <div class="container py-4">
            <div class="text-center mb-4">
                <h2 class="font-orbitron fw-bold" style="color: var(--secondary-neon);"><i class="fa-solid fa-robot me-2"></i>RECRUTEMENT IA</h2>
                <div class="d-flex justify-content-center gap-3 mt-3">
                    <button class="nav-mode-btn active" id="btnModePostuler" onclick="switchMode('postuler')">Postuler</button>
                    <button class="nav-mode-btn" id="btnModeSuivi" onclick="switchMode('suivi')">Suivre ma candidature</button>
                </div>
            </div>

            <div class="chat-container" id="chatContainer">
                <div class="chat-header">
                    <i class="fa-solid fa-microchip"></i>
                    <h5 class="font-orbitron mb-0 text-white">Assistant IA ASPEN</h5>
                </div>
                
                <div class="chat-messages" id="chatBox"></div>
                
                <div class="chat-input-area">
                    <input type="text" id="userInput" placeholder="Écris ta réponse ici..." onkeypress="handleKeyPress(event)">
                    <button class="btn-send font-orbitron" onclick="sendMessage()">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p class="mb-0">&copy; 2026 ASPEN RP — TOUS DROITS RÉSERVÉS</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentMode = 'postuler';
        let applicationStep = 0;
        let candidateData = { discord: '', poste: '', motivations: '' };
        let userPollingInterval = null; 
        let userLastMessageCount = 0;

        document.addEventListener('DOMContentLoaded', () => {
            switchMode('postuler');
        });

        function switchMode(mode) {
            currentMode = mode;
            applicationStep = 0;
            candidateData = { discord: '', poste: '', motivations: '' };
            userLastMessageCount = 0;

            if (userPollingInterval) clearInterval(userPollingInterval); 

            document.getElementById('btnModePostuler').classList.toggle('active', mode === 'postuler');
            document.getElementById('btnModeSuivi').classList.toggle('active', mode === 'suivi');
            
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = ''; 

            if (mode === 'postuler') {
                addBotMessage("Salut ! Je suis l'IA de recrutement d'ASPEN RP. Pour commencer, quel est ton pseudo Discord ? (ex: pseudo#1234)");
            } else {
                addBotMessage("Salut ! Tu souhaites suivre ta candidature et discuter avec le staff ? Quel est le pseudo Discord que tu as utilisé pour postuler ?");
            }
        }

        function addBotMessage(text) {
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML += `<div class="message bot">${text}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function addUserMessage(text) {
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML += `<div class="message user">${text}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            addUserMessage(text);
            input.value = '';
            input.disabled = true;

            setTimeout(() => {
                if (currentMode === 'postuler') handlePostulerStep(text);
                else handleSuiviStep(text);
                
                input.disabled = false;
                input.focus();
            }, 300); 
        }

        async function handlePostulerStep(text) {
            if (applicationStep === 0) {
                candidateData.discord = text;
                applicationStep++;
                addBotMessage(`Enchanté <strong>${escapeHtml(text)}</strong> ! Quel poste souhaites-tu occuper sur notre serveur ?`);
            } else if (applicationStep === 1) {
                candidateData.poste = text;
                applicationStep++;
                addBotMessage(`C'est noté pour le poste de <strong>${escapeHtml(text)}</strong>. Enfin, explique-moi quelles sont tes motivations ?`);
            } else if (applicationStep === 2) {
                candidateData.motivations = text;
                applicationStep++;
                addBotMessage("Traitement de ta candidature en cours... <i class='fa-solid fa-spinner fa-spin ms-2'></i>");
                try {
                    let response = await fetch('/api/candidatures', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(candidateData)
                    });
                    if(response.ok) addBotMessage("✅ <strong>Candidature envoyée !</strong> Le staff l'examinera au plus vite.");
                    else addBotMessage("❌ Erreur serveur.");
                } catch (e) { addBotMessage("⚠️ Erreur de connexion au backend."); }
            }
        }

        async function handleSuiviStep(text) {
            if (applicationStep === 0) {
                candidateData.discord = text;
                applicationStep++;
                addBotMessage(`Je cherche le dossier de <strong>${escapeHtml(text)}</strong>...`);
                
                try {
                    let response = await fetch('/api/candidatures');
                    let list = await response.json();
                    let candidate = list.find(c => c.discord.toLowerCase() === text.toLowerCase());

                    if (candidate) {
                        let badgeColor = candidate.status === 'Accepté' ? '#38b000' : (candidate.status === 'Refusé' ? '#d90429' : '#ffbe0b');
                        addBotMessage(`Statut de ta candidature : <strong style="color: ${badgeColor};">${candidate.status || 'En attente'}</strong>.<br><br>Tu es maintenant en direct avec le staff. Pose tes questions ici !`);
                        
                        if (candidate.messages) userLastMessageCount = candidate.messages.length;

                        if (userPollingInterval) clearInterval(userPollingInterval);
                        userPollingInterval = setInterval(() => checkNewMessagesForUser(candidateData.discord), 2500);

                    } else {
                        addBotMessage(`Désolé, aucune candidature trouvée pour <strong>${escapeHtml(text)}</strong>. Réessaie !`);
                        applicationStep = 0; 
                    }
                } catch (e) { addBotMessage("⚠️ Serveur inaccessible."); }
            } else {
                userLastMessageCount++; 
                try {
                    await fetch('/api/candidatures/message', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ discord: candidateData.discord, sender: candidateData.discord, text: text })
                    });
                } catch(e) { addBotMessage("Erreur réseau."); }
            }
        }

        async function checkNewMessagesForUser(discordPseudo) {
            if (!discordPseudo) return;
            try {
                let response = await fetch('/api/candidatures');
                let list = await response.json();
                let candidate = list.find(c => c.discord.toLowerCase() === discordPseudo.toLowerCase());

                if (candidate && candidate.messages && candidate.messages.length > userLastMessageCount) {
                    for (let i = userLastMessageCount; i < candidate.messages.length; i++) {
                        let newMsg = candidate.messages[i];
                        if (newMsg.sender === 'Staff') {
                            addBotMessage(`<strong>STAFF :</strong> ${escapeHtml(newMsg.text)}`);
                        }
                    }
                    userLastMessageCount = candidate.messages.length;
                }
            } catch (e) {}
        }

        function escapeHtml(text) { return text ? text.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }
    </script>
</body>
</html>
