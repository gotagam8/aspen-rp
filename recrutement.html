<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aspen RP - Recrutement</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b090a;
            --panel-bg: #100e14;
            --accent-pink: #ff007f;
            --accent-cyan: #00f5d4;
        }
        body { background-color: var(--bg-color); color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; margin: 0; }
        
        .top-nav { display: flex; justify-content: center; gap: 15px; padding: 25px 0 10px 0; }
        .tab-btn { background: transparent; border: 1px solid var(--accent-pink); color: white; border-radius: 20px; padding: 8px 25px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .tab-btn.active, .tab-btn:hover { background: var(--accent-pink); box-shadow: 0 0 15px var(--accent-pink); }

        .main-box { background-color: var(--panel-bg); border: 1px solid rgba(255, 0, 127, 0.3); border-radius: 14px; width: 680px; margin: 20px auto; padding: 20px; box-shadow: 0 0 25px rgba(255, 0, 127, 0.1); }
        .box-title { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 12px; margin-bottom: 15px; }
        .box-title i { color: var(--accent-cyan); font-size: 1.3rem; }
        .box-title h5 { margin: 0; font-weight: bold; letter-spacing: 0.5px; font-size: 1.1rem; }

        .chat-messages { height: 360px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 5px; margin-bottom: 15px; }
        
        .message-row { display: flex; flex-direction: column; }
        .message-row.user { align-items: flex-end; }
        .message-row.bot { align-items: flex-start; }

        .bubble { max-width: 85%; padding: 12px 16px; border-radius: 10px; font-size: 0.95rem; line-height: 1.4; word-break: break-word; }
        .bubble.bot-bubble { background: #16131d; border-left: 4px solid var(--accent-cyan); color: #e2e8f0; }
        .bubble.user-bubble { background: var(--accent-pink); color: white; border-radius: 10px; }

        .chat-input-area { display: flex; gap: 10px; background: #070609; padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08); }
        .chat-input-area input { flex: 1; background: transparent; border: none; color: white; padding: 5px 10px; outline: none; font-size: 0.95rem; }
        .chat-input-area input::placeholder { color: #6c757d; }
        
        .btn-send { background: var(--accent-cyan); border: none; color: #0b090a; width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; }
        .btn-send:hover { background: #00c4aa; }
        
        .status-card { background: #16131d; border-left: 4px solid var(--accent-pink); padding: 12px; border-radius: 8px; margin-top: 5px; }
    </style>
</head>
<body>

    <div>
        <div class="top-nav">
            <button class="tab-btn active" id="btnPostuler" onclick="switchTab('postuler')">Postuler</button>
            <button class="tab-btn" id="btnSuivi" onclick="switchTab('suivi')">Suivre ma candidature</button>
        </div>

        <div class="main-box">
            <div class="box-title">
                <i class="fa-solid fa-magnifying-glass" id="headerIcon"></i>
                <div>
                    <h5 id="headerTitle">SUIVI DE CANDIDATURE</h5>
                    <small class="text-muted" id="headerSub" style="font-size: 0.75rem;">Vérifie l'état de ton dossier</small>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages"></div>

            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="Ex: Pseudo#0000 ou Pseudo..." onkeypress="handleKey(event)">
                <button class="btn-send" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <div class="text-center pb-3 text-muted" style="font-size: 0.8rem;">
        &copy; 2026 ASPEN RP — TOUS DROITS RÉSERVÉS
    </div>

    <script>
        let currentTab = 'suivi'; // par défaut sur l'image de suivi
        let step = 0;
        let candidateData = { discord: '', poste: '', motivations: '', status: 'En attente', messages: [] };
        let trackedUser = null;

        const questions = [
            "Bienvenue ! Quel est ton **Pseudo Discord** exact ?",
            "Quel poste souhaites-tu viser au sein du staff (ex: Modérateur, Admin, Fondateur) ?",
            "Quelles sont tes motivations pour rejoindre l'équipe ?"
        ];

        document.addEventListener('DOMContentLoaded', () => {
            switchTab('suivi'); // Correspond à l'image fournie
        });

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('btnPostuler').classList.toggle('active', tab === 'postuler');
            document.getElementById('btnSuivi').classList.toggle('active', tab === 'suivi');
            
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';

            if (tab === 'postuler') {
                document.getElementById('headerTitle').innerText = "RECRUTEMENT INTERACTIF";
                document.getElementById('headerSub').innerText = "Réponds aux questions de l'assistant";
                step = 0;
                candidateData = { discord: '', poste: '', motivations: '', status: 'En attente', messages: [] };
                appendBotMsg(questions[0]);
            } else {
                document.getElementById('headerTitle').innerText = "SUIVI DE CANDIDATURE";
                document.getElementById('headerSub').innerText = "Vérifie l'état de ton dossier";
                trackedUser = null;
                appendBotMsg("Entre ton <strong>Pseudo Discord</strong> exact pour consulter l'état de ta candidature et voir les messages du staff :");
            }
        }

        function appendBotMsg(htmlText) {
            const container = document.getElementById('chatMessages');
            container.innerHTML += `
                <div class="message-row bot">
                    <div class="bubble bot-bubble">${htmlText}</div>
                </div>
            `;
            container.scrollTop = container.scrollHeight;
        }

        function appendUserMsg(text) {
            const container = document.getElementById('chatMessages');
            container.innerHTML += `
                <div class="message-row user">
                    <div class="bubble user-bubble">${escapeHtml(text)}</div>
                </div>
            `;
            container.scrollTop = container.scrollHeight;
        }

        function handleKey(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const val = input.value.trim();
            if (!val) return;

            appendUserMsg(val);
            input.value = '';

            if (currentTab === 'postuler') {
                processPostuler(val);
            } else {
                processSuivi(val);
            }
        }

        function processPostuler(val) {
            if (step === 0) {
                candidateData.discord = val;
                step++;
                appendBotMsg(questions[1]);
            } else if (step === 1) {
                candidateData.poste = val;
                step++;
                appendBotMsg(questions[2]);
            } else if (step === 2) {
                candidateData.motivations = val;
                let list = JSON.parse(localStorage.getItem('aspen_candidatures') || '[]');
                list.push(candidateData);
                localStorage.setItem('aspen_candidatures', JSON.stringify(list));

                appendBotMsg("🎉 **Candidature envoyée avec succès !** Bascule sur l'onglet 'Suivre ma candidature' pour voir ton dossier.");
                step = 3;
            } else {
                appendBotMsg("Ta candidature a déjà été enregistrée.");
            }
        }

        function processSuivi(val) {
            let list = JSON.parse(localStorage.getItem('aspen_candidatures') || '[]');

            if (!trackedUser) {
                const found = list.find(c => c.discord.toLowerCase() === val.toLowerCase());
                if (!found) {
                    appendBotMsg(`❌ Aucune candidature trouvée pour : <strong>${escapeHtml(val)}</strong>`);
                    return;
                }
                trackedUser = found.discord;
                renderDashboard(found);
            } else {
                let found = list.find(c => c.discord.toLowerCase() === trackedUser.toLowerCase());
                if (found) {
                    if (!found.messages) found.messages = [];
                    found.messages.push({ sender: found.discord, text: val, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
                    localStorage.setItem('aspen_candidatures', JSON.stringify(list));
                    renderDashboard(found);
                }
            }
        }

        function renderDashboard(c) {
            const container = document.getElementById('chatMessages');
            let msgs = '';
            if (c.messages && c.messages.length > 0) {
                c.messages.forEach(m => {
                    msgs += `• <strong style="color: ${m.sender === 'Staff' ? 'var(--accent-pink)' : 'var(--accent-cyan)'}">${escapeHtml(m.sender)}</strong> (${m.time || ''}) : ${escapeHtml(m.text)}<br>`;
                });
            } else {
                msgs = `Aucun message pour l'instant.`;
            }

            container.innerHTML = `
                <div class="message-row bot" style="width: 100%;">
                    <div class="status-card" style="width: 100%;">
                        📊 <strong>Statut de ton dossier :</strong><br>
                        • Poste : ${escapeHtml(c.poste)}<br>
                        • État : <span style="color: #ffbe0b; font-weight: bold;">${c.status || 'En attente'}</span>
                        <hr style="border-color: rgba(255,255,255,0.1); margin: 8px 0;">
                        <strong>Messages du Staff :</strong><br>
                        ${msgs}
                    </div>
                </div>
                <div class="message-row bot">
                    <div class="bubble bot-bubble">Tu peux écrire un message ci-dessous pour répondre au staff :</div>
                </div>
            `;
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
        }
    </script>
</body>
</html>
