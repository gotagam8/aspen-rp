<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASPEN RP - Recrutement IA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #07070a;
            --bg-card: #0b0c14;
            --accent-pink: #f72585;
            --secondary-neon: #00f5d4;
            --purple-glow: #3b1747;
        }

        body { background-color: var(--bg-dark); color: white; font-family: 'Rajdhani', sans-serif; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        
        .header-bar { background: rgba(10, 10, 15, 0.95); border-bottom: 2px solid var(--accent-pink); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .header-logo { height: 38px; width: auto; object-fit: contain; }

        /* Style Assistant IA / Chat */
        .chat-container { background: var(--bg-card); border: 2px solid var(--purple-glow); border-radius: 15px; max-width: 650px; margin: 30px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(247, 37, 133, 0.15); }
        .chat-header { background: rgba(15, 17, 26, 0.95); padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 12px; }
        .chat-header i { font-size: 1.5rem; color: var(--secondary-neon); }
        
        .chat-messages { height: 380px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #07080e; }
        
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 1rem; line-height: 1.4; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .message.bot { background: #121526; border-left: 3px solid var(--secondary-neon); color: #e2e8f0; align-self: flex-start; }
        .message.user { background: var(--accent-pink); color: white; align-self: flex-end; }

        .chat-input-area { padding: 15px 20px; background: var(--bg-card); border-top: 1px solid rgba(255,255,255,0.05); display: flex; gap: 10px; }
        .chat-input-area input { background: #07080e; border: 1px solid var(--purple-glow); color: white; border-radius: 8px; padding: 10px 15px; flex-grow: 1; font-family: 'Rajdhani', sans-serif; font-size: 1.05rem; }
        .chat-input-area input:focus { outline: none; border-color: var(--secondary-neon); box-shadow: 0 0 10px rgba(0, 245, 212, 0.2); }
        
        .btn-send { background: var(--secondary-neon); border: none; color: #07070a; font-weight: bold; border-radius: 8px; padding: 0 20px; transition: 0.2s; }
        .btn-send:hover { background: #00c4aa; box-shadow: 0 0 12px rgba(0, 245, 212, 0.4); }

        .nav-mode-btn { background: transparent; border: 1px solid var(--accent-pink); color: white; font-family: 'Orbitron', sans-serif; padding: 6px 18px; border-radius: 20px; font-size: 0.85rem; transition: 0.3s; }
        .nav-mode-btn.active, .nav-mode-btn:hover { background: var(--accent-pink); box-shadow: 0 0 15px rgba(247, 37, 133, 0.4); }

        footer { text-align: center; padding: 20px; background: rgba(8, 9, 14, 0.95); border-top: 1px solid rgba(255, 255, 255, 0.05); color: #64748b; font-size: 0.85rem; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div>
        <div class="header-bar">
            <div class="d-flex align-items-center gap-3">
                <a href="index.html">
                    <img src="logo.png" alt="ASPEN RP Logo" class="header-logo">
                </a>
            </div>
            <div class="d-flex align-items-center gap-3">
                <a href="index.html" class="btn btn-outline-light btn-sm font-orbitron">Retour au site</a>
            </div>
        </div>

        <div class="container py-4">
            <div class="text-center mb-4">
                <h2 class="font-orbitron fw-bold" style="color: var(--secondary-neon);"><i class="fa-solid fa-robot me-2"></i>RECRUTEMENT IA</h2>
                <div class="d-flex justify-content-center gap-3 mt-3">
                    <button class="nav-mode-btn active" id="btnModePostuler" onclick="switchMode('postuler')">Postuler</button>
                    <button class="nav-mode-btn" id="btnModeSuivi" onclick="switchMode('suivi')">Suivre ma candidature</button>
                </div>
            </div>

            <div class="chat-container" id="chatContainer">
                <div class="chat-header">
                    <i class="fa-solid fa-brain"></i>
                    <div>
                        <h6 class="font-orbitron mb-0 text-white">ASPEN AI ASSISTANT</h6>
                        <small class="text-muted" style="font-size: 0.75rem;">Mode Postulation Interactif</small>
                    </div>
                </div>
                
                <div class="chat-messages" id="chatMessages"></div>

                <div class="chat-input-area">
                    <input type="text" id="userInput" placeholder="Écris ta réponse ici..." onkeypress="handleKeyPress(event)">
                    <button class="btn btn-send" onclick="handleUserMessage()"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>

            <div class="chat-container" id="suiviContainer" style="display: none;">
                <div class="chat-header">
                    <i class="fa-solid fa-comments"></i>
                    <div>
                        <h6 class="font-orbitron mb-0 text-white">SUIVI DE CANDIDATURE & DISCUSSION</h6>
                        <small class="text-muted" style="font-size: 0.75rem;">Discussion en direct avec le staff</small>
                    </div>
                </div>
                
                <div class="chat-messages" id="suiviMessages">
                    <div class="message bot" id="suiviIntro">Entre ton <strong>Pseudo Discord</strong> exact pour consulter l'état de ton dossier et voir les messages du staff :</div>
                </div>

                <div class="chat-input-area" id="suiviInputArea">
                    <input type="text" id="suiviInput" placeholder="Ex: Pseudo#0000 ou Pseudo..." onkeypress="handleSuiviKeyPress(event)">
                    <button class="btn btn-send" onclick="handleSuiviAction()"><i class="fa-solid fa-paper-plane" id="suiviBtnIcon"></i></button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p class="mb-0">&copy; 2026 ASPEN RP — TOUS DROITS RÉSERVÉS</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let step = 0;
        let candData = { discord: '', poste: '', motivations: '', status: 'En attente', messages: [] };
        let activePseudo = null; // Mémorise le pseudo connecté pour le live-chat
        let liveInterval = null;

        const questions = [
            "Bonjour ! Quel est ton **Pseudo Discord** ?",
            "ta quel age ?",
            "Quel poste souhaites-tu intégrer au sein du serveur ? *(Ex: Modérateur, Support, Développeur...)*",
            "Quelles sont tes **motivations** pour nous rejoindre ?"
        ];

        document.addEventListener('DOMContentLoaded', () => {
            botSay(questions[0]);
            
            // Si un pseudo était déjà mémorisé dans la session du navigateur, on relance le suivi direct
            const savedPseudo = sessionStorage.getItem('aspen_active_discord');
            if (savedPseudo) {
                activePseudo = savedPseudo;
                document.getElementById('suiviInput').value = savedPseudo;
                chargerDiscussionDirecte(false);
                demarrerActualisationLive();
            }
        });

        function switchMode(mode) {
            const isPostuler = mode === 'postuler';
            document.getElementById('btnModePostuler').classList.toggle('active', isPostuler);
            document.getElementById('btnModeSuivi').classList.toggle('active', !isPostuler);
            document.getElementById('chatContainer').style.display = isPostuler ? 'block' : 'none';
            document.getElementById('suiviContainer').style.display = isPostuler ? 'none' : 'block';
        }

        function botSay(text) {
            const container = document.getElementById('chatMessages');
            container.innerHTML += `<div class="message bot">${text}</div>`;
            container.scrollTop = container.scrollHeight;
        }

        function userSay(text) {
            const container = document.getElementById('chatMessages');
            container.innerHTML += `<div class="message user">${escapeHtml(text)}</div>`;
            container.scrollTop = container.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') handleUserMessage();
        }

        function handleUserMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            userSay(text);
            input.value = '';

            if (step === 0) {
                candData.discord = text;
                step++;
                setTimeout(() => botSay(questions[1]), 500);
            } else if (step === 1) {
                candData.poste = text;
                step++;
                setTimeout(() => botSay(questions[2]), 500);
            } else if (step === 2) {
                candData.motivations = text;
                step++;
                saveCandidature(candData);

                setTimeout(() => {
                    botSay("🎉 **Candidature envoyée avec succès !** Notre équipe va l'étudier. Tu peux suivre son avancement en cliquant sur l'onglet 'Suivre ma candidature'.");
                }, 500);
            }
        }

        function saveCandidature(data) {
            let list = JSON.parse(localStorage.getItem('aspen_candidatures') || '[]');
            // Évite les doublons si l'utilisateur poste plusieurs fois
            list = list.filter(c => c.discord.toLowerCase() !== data.discord.toLowerCase());
            list.push(data);
            localStorage.setItem('aspen_candidatures', JSON.stringify(list));
        }

        // --- GESTION DU SUIVI ET DISCUSSION EN DIRECT (SANS RELOAD) ---
        function handleSuiviKeyPress(e) {
            if (e.key === 'Enter') handleSuiviAction();
        }

        function handleSuiviAction() {
            const input = document.getElementById('suiviInput');
            const val = input.value.trim();
            if (!val) return;

            if (!activePseudo) {
                // Première étape : L'utilisateur entre son pseudo pour se connecter à son fil
                let list = JSON.parse(localStorage.getItem('aspen_candidatures') || '[]');
                let found = list.find(c => c.discord.toLowerCase().includes(val.toLowerCase()));

                if (!found) {
                    const container = document.getElementById('suiviMessages');
                    container.innerHTML += `<div class="message user">${escapeHtml(val)}</div>`;
                    container.innerHTML += `<div class="message bot">❌ Aucune candidature trouvée pour ce pseudo Discord.</div>`;
                    container.scrollTop = container.scrollHeight;
                    input.value = '';
                    return;
                }

                activePseudo = found.discord;
                sessionStorage.setItem('aspen_active_discord', activePseudo);
                input.value = '';
                input.placeholder = "Écris un message au staff...";
                document.getElementById('suiviBtnIcon').className = "fa-solid fa-paper-plane";
                
                chargerDiscussionDirecte(true);
                demarrerActualisationLive();
            } else {
                // Deuxième étape : L'utilisateur est connecté, il envoie un message au staff dans sa discussion
                let list = JSON.parse(localStorage.getItem('aspen_candidatures') || '[]');
                let index = list.findIndex(c => c.discord.toLowerCase() === activePseudo.toLowerCase());

                if (index !== -1) {
                    if (!list[index].messages) list[index].messages = [];
                    
                    const now = new Date();
                    const timeString = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

                    list[index].messages.push({
                        sender: activePseudo,
                        text: val,
                        date: timeString
                    });

                    localStorage.setItem('aspen_candidatures', JSON.stringify(list));
                    input.value = '';
                    chargerDiscussionDirecte(false); // Met à jour l'affichage instantanément
                }
            }
        }

        function chargerDiscussionDirecte(showWelcome) {
            let list = JSON.parse(localStorage.getItem('aspen_candidatures') || '[]');
            let found = list.find(c => c.discord.toLowerCase() === activePseudo.toLowerCase());
            const container = document.getElementById('suiviMessages');

            if (!found) return;

            let statusColor = found.status === 'Accepté' ? '#38b000' : (found.status === 'Refusé' ? '#d90429' : '#ffbe0b');
            
            let html = `
                <div class="message bot">
                    <strong>📊 Statut : <span style="color: ${statusColor};">${found.status || 'En attente'}</span></strong><br>
                    • Poste : ${escapeHtml(found.poste)}
                </div>
            `;

            if (found.messages && found.messages.length > 0) {
                found.messages.forEach(m => {
                    let isUser = m.sender.toLowerCase() === activePseudo.toLowerCase();
                    let bubbleClass = isUser ? 'message user' : 'message bot';
                    let senderLabel = isUser ? 'Toi' : `<strong style="color: #f72585;">Staff</strong>`;
                    html += `<div class="${bubbleClass}"><small style="display: block; font-size: 0.75rem; opacity: 0.8;">${senderLabel} (${m.date || ''})</small>${escapeHtml(m.text)}</div>`;
                });
            } else {
                html += `<div class="message bot">Aucun message pour l'instant. Le staff te répondra ici.</div>`;
            }

            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        }

        function demarrerActualisationLive() {
            if (liveInterval) clearInterval(liveInterval);
            // Vérifie les modifications du localStorage toutes les 2 secondes en arrière-plan (temps réel sans recharger)
            liveInterval = setInterval(() => {
                if (activePseudo) {
                    chargerDiscussionDirecte(false);
                }
            }, 2000);
        }

        function escapeHtml(text) {
            return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
        }
    </script>
</body>
</html>
