<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aspen RP - Recrutement IA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b090a;
            --panel-bg: #161a1d;
            --accent-pink: #f72585;
            --accent-cyan: #00f5d4;
            --text-color: #ffffff;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .container-box {
            background-color: var(--panel-bg);
            border: 1px solid rgba(247, 37, 133, 0.3);
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(247, 37, 133, 0.15);
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }
        .btn-mode {
            background: transparent;
            border: 2px solid var(--accent-pink);
            color: white;
            border-radius: 20px;
            padding: 6px 20px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-mode.active, .btn-mode:hover {
            background: var(--accent-pink);
            box-shadow: 0 0 15px var(--accent-pink);
        }
        .chat-messages {
            height: 350px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 10px 15px;
            border-radius: 10px;
            max-width: 80%;
            word-break: break-word;
        }
        .message.bot {
            background: #212529;
            border-left: 4px solid var(--accent-cyan);
            align-self: flex-start;
        }
        .message.user {
            background: var(--accent-pink);
            color: white;
            align-self: flex-end;
        }
        .chat-input-area {
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            background: #0b090a;
            border: 1px solid #343a40;
            color: white;
            border-radius: 8px;
            padding: 10px 15px;
        }
        .chat-input-area input:focus {
            border-color: var(--accent-cyan);
            outline: none;
        }
        .btn-send {
            background: var(--accent-cyan);
            border: none;
            color: #000;
            font-weight: bold;
            border-radius: 8px;
            padding: 0 20px;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: #6c757d;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="text-center my-4">
            <h2><i class="fa-solid fa-robot"></i> RECRUTEMENT IA</h2>
            <div class="d-flex justify-content: center; gap: 15px; margin-top: 20px;">
                <button class="btn btn-mode active" id="btnModePostuler" onclick="switchMode('postuler')">Postuler</button>
                <button class="btn btn-mode" id="btnModeSuivi" onclick="switchMode('suivi')">Suivre ma candidature</button>
            </div>
        </div>

        <div class="container-box">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-area" id="chatInputArea">
                <input type="text" id="userInput" placeholder="Écris ta réponse ici..." onkeypress="handleKey(event)">
                <button class="btn btn-send" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 ASPEN RP — TOUS DROITS RÉSERVÉS</p>
    </footer>

    <script>
        let currentMode = 'postuler';
        let step = 0;
        let candidateData = { discord: '', poste: '', motivations: '', status: 'En attente', messages: [] };
        let trackedUser = null;

        const questions = [
            { text: "Bienvenue sur le système de recrutement d'ASPEN RP ! Quel est ton **Pseudo Discord** exact ?" },
            { text: "Quel poste souhaites-tu viser au sein du staff (ex: Modérateur, Admin, Développeur) ?" },
            { text: "Quelles sont tes motivations pour rejoindre l'équipe ?" }
        ];

        document.addEventListener('DOMContentLoaded', () => { startPostulerFlow(); });

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('btnModePostuler').classList.toggle('active', mode === 'postuler');
            document.getElementById('btnModeSuivi').classList.toggle('active', mode === 'suivi');
            
            if (mode === 'postuler') {
                startPostulerFlow();
            } else {
                startSuiviFlow();
            }
        }

        function startPostulerFlow() {
            step = 0;
            candidateData = { discord: '', poste: '', motivations: '', status: 'En attente', messages: [] };
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            appendBotMessage(questions[0].text);
        }

        function startSuiviFlow() {
            trackedUser = null;
            const container = document.getElementById('chatMessages');
            container.innerHTML = `<div class="message bot">Entre ton <strong>Pseudo Discord</strong> exact pour consulter l'état de ta candidature et discuter avec le staff :</div>`;
        }

        function appendBotMessage(text) {
            const container = document.getElementById('chatMessages');
            container.innerHTML += `<div class="message bot">${text}</div>`;
            container.scrollTop = container.scrollHeight;
        }

        function appendUserMessage(text) {
            const container = document.getElementById('chatMessages');
            container.innerHTML += `<div class="message user">${escapeHtml(text)}</div>`;
            container.scrollTop = container.scrollHeight;
        }

        function handleKey(e) { if (e.key === 'Enter') sendMessage(); }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            appendUserMessage(text);
            input.value = '';

            if (currentMode === 'postuler') {
                processPostuler(text);
            } else {
                processSuivi(text, text);
            }
        }

        function processPostuler(text) {
            if (step === 0) {
                candidateData.discord = text;
                step++;
                appendBotMessage(questions[1].text);
            } else if (step === 1) {
                candidateData.poste = text;
                step++;
                appendBotMessage(questions[2].text);
            } else if (step === 2) {
                candidateData.motivations = text;
                
                let list = JSON.parse(localStorage.getItem('aspen_candidatures') || '[]');
                list.push(candidateData);
                localStorage.setItem('aspen_candidatures', JSON.stringify(list));

                appendBotMessage("🎉 **Candidature envoyée avec succès !** Bascule sur l'onglet 'Suivre ma candidature' pour voir ton dossier et échanger avec le staff.");
                step = 3;
            } else {
                appendBotMessage("Ta candidature a déjà été enregistrée.");
            }
        }

        function processSuivi(inputVal, originalText) {
            let list = JSON.parse(localStorage.getItem('aspen_candidatures') || '[]');
            
            if (!trackedUser) {
                const candidate = list.find(c => c.discord.toLowerCase() === inputVal.toLowerCase());
                const container = document.getElementById('chatMessages');
                
                if (!candidate) {
                    container.innerHTML += `<div class="message bot text-danger">❌ Aucune candidature trouvée pour : <strong>${escapeHtml(inputVal)}</strong></div>`;
                    container.scrollTop = container.scrollHeight;
                    return;
                }
                
                trackedUser = candidate.discord;
                renderCandidateDashboard(candidate);
            } else {
                // Envoi d'un message dans le ticket existant
                let candidate = list.find(c => c.discord.toLowerCase() === trackedUser.toLowerCase());
                if (candidate) {
                    if (!candidate.messages) candidate.messages = [];
                    candidate.messages.push({
                        sender: trackedUser,
                        text: originalText,
                        date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    });
                    localStorage.setItem('aspen_candidatures', JSON.stringify(list));
                    renderCandidateDashboard(candidate);
                }
            }
        }

        function renderCandidateDashboard(candidate) {
            const container = document.getElementById('chatMessages');
            let msgsHtml = '';
            if (candidate.messages && candidate.messages.length > 0) {
                candidate.messages.forEach(m => {
                    let color = m.sender === 'Staff' ? 'var(--accent-pink)' : 'var(--accent-cyan)';
                    msgsHtml += `<div style="margin: 5px 0;"><strong style="color: ${color};">${m.sender}</strong> <span style="font-size:0.75rem; color:#aaa;">(${m.date || ''})</span> : ${escapeHtml(m.text)}</div>`;
                });
            } else {
                msgsHtml = `Aucun message pour l'instant.`;
            }

            container.innerHTML = `
                <div class="message bot" style="width: 100%; border-left-color: var(--accent-pink);">
                    📊 <strong>Statut de ton dossier :</strong><br>
                    • Poste : ${escapeHtml(candidate.poste)}<br>
                    • État : <span style="color: #ffbe0b; font-weight: bold;">${candidate.status || 'En attente'}</span>
                    <hr style="border-color: rgba(255,255,255,0.1); margin: 8px 0;">
                    <strong>Discussion avec le Staff :</strong><br>
                    <div style="background: rgba(0,0,0,0.2); padding: 10px; border-radius: 6px; max-height: 150px; overflow-y: auto;">
                        ${msgsHtml}
                    </div>
                </div>
                <div class="message bot">Tu peux écrire un message ci-dessous pour répondre au staff :</div>
            `;
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
        }
    </script>
</body>
</html>
