<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASPEN RP - Recrutement IA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #07070a;
            --bg-card: #0b0c14;
            --accent-pink: #f72585;
            --secondary-neon: #00f5d4;
            --purple-glow: #3b1747;
        }

        body { background-color: var(--bg-dark); color: white; font-family: 'Rajdhani', sans-serif; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        
        .header-bar { background: rgba(10, 10, 15, 0.95); border-bottom: 2px solid var(--accent-pink); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        
        .chat-container { background: var(--bg-card); border: 2px solid var(--purple-glow); border-radius: 15px; max-width: 650px; margin: 30px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(247, 37, 133, 0.15); }
        .chat-header { background: rgba(15, 17, 26, 0.95); padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 12px; }
        .chat-header i { font-size: 1.5rem; color: var(--secondary-neon); }
        
        .chat-messages { height: 380px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #07080e; }
        
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 1rem; line-height: 1.4; }
        .message.bot { background: #121526; border-left: 3px solid var(--secondary-neon); color: #e2e8f0; align-self: flex-start; }
        .message.user { background: var(--accent-pink); color: white; align-self: flex-end; }

        .chat-input-area { padding: 15px 20px; background: var(--bg-card); border-top: 1px solid rgba(255,255,255,0.05); display: flex; gap: 10px; }
        .chat-input-area input { background: #07080e; border: 1px solid var(--purple-glow); color: white; border-radius: 8px; padding: 10px 15px; flex-grow: 1; font-family: 'Rajdhani', sans-serif; font-size: 1.05rem; }
        .chat-input-area input:focus { outline: none; border-color: var(--secondary-neon); box-shadow: 0 0 10px rgba(0, 245, 212, 0.2); }
        
        .btn-send { background: var(--secondary-neon); border: none; color: #07070a; font-weight: bold; border-radius: 8px; padding: 0 20px; cursor: pointer; }
        .btn-send:hover { background: #00c4aa; }

        .nav-mode-btn { background: transparent; border: 1px solid var(--accent-pink); color: white; font-family: 'Orbitron', sans-serif; padding: 6px 18px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; transition: 0.3s; }
        .nav-mode-btn.active, .nav-mode-btn:hover { background: var(--accent-pink); box-shadow: 0 0 15px rgba(247, 37, 133, 0.4); }

        footer { text-align: center; padding: 20px; background: rgba(8, 9, 14, 0.95); border-top: 1px solid rgba(255, 255, 255, 0.05); color: #64748b; font-size: 0.85rem; font-family: 'Orbitron', sans-serif; }
    </style>
</head>
<body>

    <div>
        <div class="header-bar">
            <h4 class="font-orbitron mb-0" style="color: var(--accent-pink);"><i class="fa-solid fa-shield-halved me-2"></i>ASPEN<span class="text-white">RP</span></h4>
            <a href="moderateur.html" class="btn btn-outline-light btn-sm font-orbitron">Espace Staff</a>
        </div>

        <div class="container py-4">
            <div class="text-center mb-4">
                <h2 class="font-orbitron fw-bold" style="color: var(--secondary-neon);"><i class="fa-solid fa-robot me-2"></i>RECRUTEMENT IA</h2>
                <div class="d-flex justify-content-center gap-3 mt-3">
                    <button class="nav-mode-btn active" id="btnModePostuler" onclick="switchMode('postuler')">Postuler</button>
                    <button class="nav-mode-btn" id="btnModeSuivi" onclick="switchMode('suivi')">Suivre ma candidature</button>
                </div>
            </div>

            <div class="chat-container">
                <div class="chat-header">
                    <i class="fa-solid fa-brain"></i>
                    <div>
                        <h6 class="font-orbitron mb-0 text-white">ASPEN AI ASSISTANT</h6>
                        <small class="text-muted" style="font-size: 0.75rem;">Mode Interactif</small>
                    </div>
                </div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-area">
                    <input type="text" id="userInput" placeholder="Écris ta réponse ici..." onkeypress="handleKey(event)">
                    <button class="btn btn-send" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p class="mb-0">&copy; 2026 ASPEN RP — TOUS DROITS RÉSERVÉS</p>
    </footer>

    <script>
        let currentMode = 'postuler';
        let step = 0;
        let candidateData = { discord: '', poste: '', motivations: '', status: 'En attente', messages: [] };
        let activeTrackingUser = null;

        const questions = [
            { text: "Bienvenue ! Quel est ton **Pseudo Discord** exact ?" },
            { text: "Quel poste souhaites-tu viser (ex: Modérateur, Admin, Développeur) ?" },
            { text: "Quelles sont tes motivations pour rejoindre notre équipe ?" }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            startPostulerFlow();
        });

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('btnModePostuler').classList.toggle('active', mode === 'postuler');
            document.getElementById('btnModeSuivi').classList.toggle('active', mode === 'suivi');
            
            if (mode === 'postuler') {
                startPostulerFlow();
            } else {
                startSuiviFlow();
            }
        }

        function startPostulerFlow() {
            step = 0;
            activeTrackingUser = null;
            candidateData = { discord: '', poste: '', motivations: '', status: 'En attente', messages: [] };
            document.getElementById('chatMessages').innerHTML = '';
            appendBotMessage(questions[0].text);
        }

        function startSuiviFlow() {
            activeTrackingUser = null;
            document.getElementById('chatMessages').innerHTML = `
                <div class="message bot">
                    Entre ton <strong>Pseudo Discord</strong> exact pour consulter l'état de ta candidature et discuter avec le staff :
                </div>
            `;
        }

        function appendBotMessage(text) {
            const container = document.getElementById('chatMessages');
            container.innerHTML += `<div class="message bot">${text}</div>`;
            container.scrollTop = container.scrollHeight;
        }

        function appendUserMessage(text) {
            const container = document.getElementById('chatMessages');
            container.innerHTML += `<div class="message user">${escapeHtml(text)}</div>`;
            container.scrollTop = container.scrollHeight;
        }

        function handleKey(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            appendUserMessage(text);
            input.value = '';

            if (currentMode === 'postuler') {
                processPostuler(text);
            } else {
                processSuivi(text);
            }
        }

        function processPostuler(text) {
            if (step === 0) {
                candidateData.discord = text;
                step++;
                appendBotMessage(questions[1].text);
            } else if (step === 1) {
                candidateData.poste = text;
                step++;
                appendBotMessage(questions[2].text);
            } else if (step === 2) {
                candidateData.motivations = text;
                
                let list = JSON.parse(localStorage.getItem('aspen_candidatures') || '[]');
                list.push(candidateData);
                localStorage.setItem('aspen_candidatures', JSON.stringify(list));

                appendBotMessage("🎉 **Candidature enregistrée avec succès !** Tu peux maintenant basculer sur l'onglet 'Suivre ma candidature' en haut.");
                step = 3;
            } else {
                appendBotMessage("Ta candidature a déjà été envoyée.");
            }
        }

        function processSuivi(text) {
            let list = JSON.parse(localStorage.getItem('aspen_candidatures') || '[]');

            if (!activeTrackingUser) {
                const candidate = list.find(c => c.discord.toLowerCase() === text.toLowerCase());
                if (!candidate) {
                    appendBotMessage(`❌ Aucune candidature trouvée pour le pseudo : <strong>${escapeHtml(text)}</strong>`);
                    return;
                }
                activeTrackingUser = candidate.discord;
                renderSuiviDashboard(candidate);
            } else {
                let candidate = list.find(c => c.discord.toLowerCase() === activeTrackingUser.toLowerCase());
                if (candidate) {
                    if (!candidate.messages) candidate.messages = [];
                    candidate.messages.push({
                        sender: candidate.discord,
                        text: text,
                        date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    });
                    localStorage.setItem('aspen_candidatures', JSON.stringify(list));
                    renderSuiviDashboard(candidate);
                }
            }
        }

        function renderSuiviDashboard(candidate) {
            const container = document.getElementById('chatMessages');
            let msgsHtml = '';
            if (candidate.messages && candidate.messages.length > 0) {
                candidate.messages.forEach(m => {
                    let color = m.sender === 'Staff' ? 'var(--accent-pink)' : 'var(--secondary-neon)';
                    msgsHtml += `<div style="margin-bottom: 6px;"><strong style="color: ${color};">${escapeHtml(m.sender)}</strong> : ${escapeHtml(m.text)}</div>`;
                });
            } else {
                msgsHtml = `Aucun message dans le ticket pour le moment.`;
            }

            container.innerHTML = `
                <div class="message bot" style="width: 100%;">
                    📊 <strong>Dossier de ${escapeHtml(candidate.discord)}</strong><br>
                    • Poste : ${escapeHtml(candidate.poste)}<br>
                    • Statut : <span class="text-warning fw-bold">${candidate.status || 'En attente'}</span>
                    <hr style="border-color: rgba(255,255,255,0.1);">
                    <strong>Discussion :</strong><br>
                    <div style="background: #07080e; padding: 10px; border-radius: 8px; max-height: 150px; overflow-y: auto; margin-top: 5px;">
                        ${msgsHtml}
                    </div>
                </div>
                <div class="message bot">Tu peux écrire un message ci-dessous pour répondre au staff :</div>
            `;
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
        }
    </script>
</body>
</html>
