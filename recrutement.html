<script>
    let currentMode = 'postuler';
    let applicationStep = 0;
    let candidateData = { discord: '', poste: '', motivations: '' };
    let userPollingInterval = null; // Boucle de rafraîchissement
    let userLastMessageCount = 0;

    document.addEventListener('DOMContentLoaded', () => {
        switchMode('postuler');
    });

    function switchMode(mode) {
        currentMode = mode;
        applicationStep = 0;
        candidateData = { discord: '', poste: '', motivations: '' };
        userLastMessageCount = 0;

        if (userPollingInterval) clearInterval(userPollingInterval); // Arrêter l'ancienne boucle si on change d'onglet

        document.getElementById('btnModePostuler').classList.toggle('active', mode === 'postuler');
        document.getElementById('btnModeSuivi').classList.toggle('active', mode === 'suivi');
        
        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML = ''; 

        if (mode === 'postuler') {
            addBotMessage("Salut ! Je suis l'IA de recrutement d'ASPEN RP. Pour commencer, quel est ton pseudo Discord ? (ex: pseudo#1234)");
        } else {
            addBotMessage("Salut ! Tu souhaites suivre ta candidature et discuter avec le staff ? Quel est le pseudo Discord que tu as utilisé pour postuler ?");
        }
    }

    function addBotMessage(text) {
        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML += `<div class="message bot">${text}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function addUserMessage(text) {
        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML += `<div class="message user">${text}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        addUserMessage(text);
        input.value = '';
        input.disabled = true;

        setTimeout(() => {
            if (currentMode === 'postuler') handlePostulerStep(text);
            else handleSuiviStep(text);
            
            input.disabled = false;
            input.focus();
        }, 300); 
    }

    async function handlePostulerStep(text) {
        // ... Ton code d'étapes de postulation actuel reste identique ici ...
        if (applicationStep === 0) {
            candidateData.discord = text;
            applicationStep++;
            addBotMessage(`Enchanté <strong>${text}</strong> ! Quel poste souhaites-tu occuper sur notre serveur ? (ex: LSPD, EMS, Staff, etc.)`);
        } else if (applicationStep === 1) {
            candidateData.poste = text;
            applicationStep++;
            addBotMessage(`C'est noté pour le poste de <strong>${text}</strong>. Enfin, explique-moi en quelques phrases quelles sont tes motivations ?`);
        } else if (applicationStep === 2) {
            candidateData.motivations = text;
            applicationStep++;
            addBotMessage("Traitement de ta candidature en cours... <i class='fa-solid fa-spinner fa-spin ms-2'></i>");
            try {
                let response = await fetch('/api/candidatures', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(candidateData)
                });
                if(response.ok) addBotMessage("✅ <strong>Candidature envoyée !</strong> Le staff l'examinera au plus vite.");
                else addBotMessage("❌ Erreur serveur.");
            } catch (e) { addBotMessage("⚠️ Erreur de connexion au backend."); }
        }
    }

    async function handleSuiviStep(text) {
        if (applicationStep === 0) {
            candidateData.discord = text;
            applicationStep++;
            addBotMessage(`Je cherche le dossier de <strong>${text}</strong>...`);
            
            try {
                let response = await fetch('/api/candidatures');
                let list = await response.json();
                let candidate = list.find(c => c.discord.toLowerCase() === text.toLowerCase());

                if (candidate) {
                    let badgeColor = candidate.status === 'Accepté' ? '#38b000' : (candidate.status === 'Refusé' ? '#d90429' : '#ffbe0b');
                    addBotMessage(`Statut de ta candidature : <strong style="color: ${badgeColor};">${candidate.status || 'En attente'}</strong>.<br><br>Tu es maintenant en direct avec le staff. Pose tes questions ici !`);
                    
                    // Si le joueur a déjà des messages, on les compte pour éviter de les afficher en double
                    if (candidate.messages) userLastMessageCount = candidate.messages.length;

                    // Lancer la vérification de nouveaux messages toutes les 2.5 secondes
                    if (userPollingInterval) clearInterval(userPollingInterval);
                    userPollingInterval = setInterval(() => checkNewMessagesForUser(text), 2500);

                } else {
                    addBotMessage(`Désolé, aucune candidature trouvée pour <strong>${text}</strong>. Réessaie !`);
                    applicationStep = 0; 
                }
            } catch (e) { addBotMessage("⚠️ Serveur inaccessible."); }
        } else {
            // Le joueur envoie un message au staff
            userLastMessageCount++; // On anticipe
            try {
                await fetch('/api/candidatures/message', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ discord: candidateData.discord, sender: candidateData.discord, text: text })
                });
            } catch(e) { addBotMessage("Erreur réseau."); }
        }
    }

    // Fonction de rafraîchissement invisible pour le joueur
    async function checkNewMessagesForUser(discordPseudo) {
        try {
            let response = await fetch('/api/candidatures');
            let list = await response.json();
            let candidate = list.find(c => c.discord.toLowerCase() === discordPseudo.toLowerCase());

            if (candidate && candidate.messages && candidate.messages.length > userLastMessageCount) {
                // Il y a de nouveaux messages ! On affiche seulement les nouveaux.
                for (let i = userLastMessageCount; i < candidate.messages.length; i++) {
                    let newMsg = candidate.messages[i];
                    // On affiche seulement les messages qui viennent du staff (ceux du joueur ont déjà été affichés par sendMessage)
                    if (newMsg.sender === 'Staff') {
                        addBotMessage(`<strong> STAFF :</strong> ${escapeHtml(newMsg.text)}`);
                    }
                }
                userLastMessageCount = candidate.messages.length;
            }
        } catch (e) {
            // Silencieux pour ne pas spammer le joueur en cas de micro-coupure
        }
    }

    function escapeHtml(text) { return text ? text.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }
</script>
