<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASPEN STAFF - Espace Modération & Membres</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #07070a;
            --bg-card: #0b0c14;
            --accent-pink: #f72585;
            --secondary-neon: #00f5d4;
            --purple-glow: #3b1747;
        }

        body { background-color: var(--bg-dark); color: white; font-family: 'Rajdhani', sans-serif; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        
        .header-bar { background: rgba(10, 10, 15, 0.95); border-bottom: 2px solid var(--accent-pink); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        
        .cand-card { background: var(--bg-card); border: 1px solid var(--purple-glow); border-radius: 12px; padding: 20px; margin-bottom: 20px; transition: 0.3s; }
        .cand-card:hover { border-color: var(--secondary-neon); box-shadow: 0 5px 15px rgba(0, 245, 212, 0.1); }

        .status-badge { padding: 4px 12px; border-radius: 6px; font-weight: bold; font-size: 0.85rem; text-transform: uppercase; }
        .status-En-attente { background: #ffbe0b; color: #000; }
        .status-Accepté { background: #38b000; color: #fff; }
        .status-Refusé { background: #d90429; color: #fff; }

        .nav-tabs .nav-link { color: #a0aec0; border: none; font-family: 'Orbitron', sans-serif; font-weight: 600; cursor: pointer; }
        .nav-tabs .nav-link.active { background: transparent; color: var(--secondary-neon); border-bottom: 2px solid var(--secondary-neon); }
        
        .ticket-box { background: var(--bg-card); border: 2px solid var(--accent-pink); border-radius: 12px; padding: 20px; margin-top: 20px; }
        .ticket-messages { height: 300px; overflow-y: auto; background: #07080e; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .msg-bubble { max-width: 80%; padding: 10px 14px; border-radius: 10px; font-size: 0.95rem; }
        .msg-bubble.staff { align-self: flex-end; background: var(--accent-pink); color: white; }
        .msg-bubble.user { align-self: flex-start; background: #151828; border-left: 3px solid var(--secondary-neon); color: #e2e8f0; }

        footer { text-align: center; padding: 20px; background: rgba(8, 9, 14, 0.95); border-top: 1px solid rgba(255, 255, 255, 0.05); color: #64748b; font-size: 0.85rem; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div>
        <div class="header-bar">
            <div class="d-flex align-items-center gap-3">
                <h4 class="font-orbitron mb-0" style="color: var(--accent-pink);"><i class="fa-solid fa-shield-halved me-2"></i>ASPEN<span class="text-white">STAFF</span></h4>
            </div>
            <div class="d-flex align-items-center gap-3">
                <a href="index.html" class="btn btn-outline-light btn-sm font-orbitron">Retour au site</a>
            </div>
        </div>

        <div class="container py-4">
            <ul class="nav nav-tabs mb-4 border-bottom border-secondary" id="staffTabs">
                <li class="nav-item">
                    <button class="nav-link active" id="tab-recrutement" onclick="switchTab('recrutement')"><i class="fa-solid fa-user-plus me-2"></i>Recrutement & Tickets</button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" id="tab-joueurs" onclick="switchTab('joueurs')"><i class="fa-solid fa-database me-2"></i>Joueurs</button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" id="tab-membres" onclick="switchTab('membres')"><i class="fa-solid fa-users me-2"></i>Membres Discord</button>
                </li>
            </ul>

            <div id="section-recrutement">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="font-orbitron mb-0"><i class="fa-solid fa-folder-open me-2 text-warning"></i>CANDIDATURES REÇUES</h3>
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-warning btn-sm font-orbitron" onclick="sendUrgentAlert()">
                            <i class="fa-solid fa-triangle-exclamation me-1"></i> Alerte Staff
                        </button>
                        <button class="btn btn-outline-danger btn-sm font-orbitron" onclick="clearCandidaturesList()">
                            <i class="fa-solid fa-trash me-1"></i> Vider la liste
                        </button>
                    </div>
                </div>
                
                <div id="candidaturesList" class="row"></div>

                <div id="ticketSection" style="display: none;" class="ticket-box">
                    <div class="d-flex justify-content-between align-items-center mb-3 border-bottom border-secondary pb-2">
                        <h5 class="font-orbitron mb-0 text-info"><i class="fa-solid fa-ticket me-2"></i>DISCUSSION AVEC : <span id="ticketCandidateName" class="text-white text-uppercase"></span></h5>
                        <button class="btn btn-outline-secondary btn-sm font-orbitron" onclick="closeTicketView()"><i class="fa-solid fa-arrow-left me-1"></i> Retour aux candidatures</button>
                    </div>
                    <div id="ticketMessagesContainer" class="ticket-messages"></div>
                    <div class="input-group">
                        <input type="text" id="staffTicketInput" class="form-control bg-dark text-white border-secondary" placeholder="Écris ton message..." onkeypress="handleTicketKey(event)">
                        <button class="btn btn-info font-orbitron text-dark fw-bold px-4" style="background: var(--secondary-neon); border: none;" onclick="sendTicketMessage()"><i class="fa-solid fa-paper-plane me-1"></i> Envoyer</button>
                    </div>
                </div>
            </div>

            <div id="section-joueurs" style="display: none;">
                <h3 class="font-orbitron mb-4"><i class="fa-solid fa-database me-2 text-info"></i>GESTION DES JOUEURS</h3>
                <div class="cand-card text-center text-muted py-5">
                    <h5>Aucune donnée joueur connectée pour le moment.</h5>
                </div>
            </div>

            <div id="section-membres" style="display: none;">
                <h3 class="font-orbitron mb-4"><i class="fa-solid fa-users me-2 text-success"></i>MEMBRES DISCORD</h3>
                <div class="cand-card text-center text-muted py-5">
                    <h5>Synchronisation des membres Discord en attente...</h5>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p class="mb-0">&copy; 2026 ASPEN RP — TOUS DROITS RÉSERVÉS</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let activeTicketIndex = null;
        let candidaturesListCache = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadCandidaturesFromServer();
            setInterval(() => {
                loadCandidaturesFromServer(true);
            }, 3000);
        });

        function switchTab(tab) {
            document.getElementById('tab-recrutement').classList.toggle('active', tab === 'recrutement');
            document.getElementById('tab-joueurs').classList.toggle('active', tab === 'joueurs');
            document.getElementById('tab-membres').classList.toggle('active', tab === 'membres');

            document.getElementById('section-recrutement').style.display = tab === 'recrutement' ? 'block' : 'none';
            document.getElementById('section-joueurs').style.display = tab === 'joueurs' ? 'block' : 'none';
            document.getElementById('section-membres').style.display = tab === 'membres' ? 'block' : 'none';
        }

        async function loadCandidaturesFromServer(silent = false) {
            try {
                let response = await fetch('/api/candidatures');
                if (response.ok) {
                    candidaturesListCache = await response.json();
                    if (!silent || activeTicketIndex === null) {
                        renderCandidatures();
                    }
                    if (activeTicketIndex !== null) {
                        renderTicketMessages();
                    }
                }
            } catch (err) {
                console.error("Erreur chargement candidatures :", err);
            }
        }

        async function sendUrgentAlert() {
            if (!confirm("Voulez-vous envoyer une alerte sur votre Discord ?")) return;
            try {
                let response = await fetch('/api/urgent-alert', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
                if (response.ok) alert("Alerte envoyée avec succès !");
            } catch (err) {
                console.error(err);
            }
        }

        async function clearCandidaturesList() {
            if (!confirm("Voulez-vous vraiment vider toutes les candidatures ?")) return;
            try {
                await fetch('/api/candidatures', { method: 'DELETE' });
                candidaturesListCache = [];
                closeTicketView();
                renderCandidatures();
            } catch (err) {
                console.error("Erreur lors de la suppression :", err);
            }
        }

        function renderCandidatures() {
            const container = document.getElementById('candidaturesList');
            let list = candidaturesListCache;

            if (list.length === 0) {
                container.innerHTML = `<div class="col-12 text-center text-muted my-5"><h5>Aucune candidature n'a été soumise pour le moment.</h5></div>`;
                return;
            }

            container.innerHTML = '';
            list.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'col-md-6';
                
                let msgsHtml = '';
                if(item.messages && item.messages.length > 0) {
                    item.messages.slice(-2).forEach(m => {
                        let color = m.sender === 'Staff' ? '#f72585' : '#00f5d4';
                        msgsHtml += `<div class="text-muted mb-1" style="font-size: 0.85rem;">• <strong style="color: ${color};">${m.sender}</strong> : ${escapeHtml(m.text)}</div>`;
                    });
                } else {
                    msgsHtml = `<span class="text-muted" style="font-size: 0.85rem;">Aucun message.</span>`;
                }

                card.innerHTML = `
                    <div class="cand-card">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="font-orbitron mb-0"><i class="fa-brands fa-discord me-2 text-primary"></i>${escapeHtml(item.discord)}</h5>
                            <span class="status-badge status-${(item.status || 'En-attente').replace(' ', '-')}">${item.status || 'En attente'}</span>
                        </div>
                        <p class="mb-1"><strong>Poste :</strong> ${escapeHtml(item.poste)}</p>
                        <p class="mb-3"><strong>Motivations :</strong> ${escapeHtml(item.motivations)}</p>
                        <div class="p-2 rounded mb-3" style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);">
                            <small class="text-info d-block mb-1 font-orbitron" style="font-size: 0.75rem;">Derniers messages :</small>
                            <div>${msgsHtml}</div>
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-success btn-sm flex-fill" onclick="updateStatus(${index}, 'Accepté')">Accepter</button>
                            <button class="btn btn-danger btn-sm flex-fill" onclick="updateStatus(${index}, 'Refusé')">Refuser</button>
                            <button class="btn btn-outline-info btn-sm flex-fill font-orbitron" onclick="openTicket(${index})"><i class="fa-solid fa-comments me-1"></i> Discussion</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openTicket(index) {
            activeTicketIndex = index;
            const candidate = candidaturesListCache[index];

            document.getElementById('ticketCandidateName').innerText = candidate.discord;
            document.getElementById('candidaturesList').style.display = 'none';
            document.getElementById('ticketSection').style.display = 'block';
            renderTicketMessages();
        }

        function closeTicketView() {
            activeTicketIndex = null;
            document.getElementById('ticketSection').style.display = 'none';
            document.getElementById('candidaturesList').style.display = 'flex';
            renderCandidatures();
        }

        function renderTicketMessages() {
            if (activeTicketIndex === null || !candidaturesListCache[activeTicketIndex]) return;

            const candidate = candidaturesListCache[activeTicketIndex];
            const container = document.getElementById('ticketMessagesContainer');
            container.innerHTML = '';

            if (!candidate.messages || candidate.messages.length === 0) {
                container.innerHTML = `<div class="text-center text-muted my-auto">Aucun message pour l'instant.</div>`;
                return;
            }

            candidate.messages.forEach(m => {
                const bubble = document.createElement('div');
                const isStaff = m.sender === 'Staff';
                bubble.className = `msg-bubble ${isStaff ? 'staff' : 'user'}`;
                bubble.innerHTML = `<div style="font-size: 0.75rem; opacity: 0.8; margin-bottom: 2px;"><strong>${escapeHtml(m.sender)}</strong> • ${m.date || ''}</div><div>${escapeHtml(m.text)}</div>`;
                container.appendChild(bubble);
            });
            container.scrollTop = container.scrollHeight;
        }

        function handleTicketKey(e) {
            if (e.key === 'Enter') sendTicketMessage();
        }

        async function sendTicketMessage() {
            const input = document.getElementById('staffTicketInput');
            const text = input.value.trim();
            if (!text || activeTicketIndex === null) return;

            if (!candidaturesListCache[activeTicketIndex].messages) {
                candidaturesListCache[activeTicketIndex].messages = [];
            }

            const now = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            candidaturesListCache[activeTicketIndex].messages.push({
                sender: 'Staff',
                date: now,
                text: text
            });

            input.value = '';

            try {
                await fetch(`/api/candidatures/${activeTicketIndex}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(candidaturesListCache[activeTicketIndex])
                });
            } catch (err) {
                console.error("Erreur d'envoi du message :", err);
            }

            renderTicketMessages();
        }

        async function updateStatus(index, newStatus) {
            candidaturesListCache[index].status = newStatus;

            try {
                await fetch(`/api/candidatures/${index}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(candidaturesListCache[index])
                });
            } catch (err) {
                console.error("Erreur de mise à jour du statut :", err);
            }

            renderCandidatures();
        }

        function escapeHtml(text) {
            return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
        }
    </script>
</body>
</html>
