<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASPEN STAFF - Espace Modération</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #0b0b0e; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid #ff2a8533; background: #0d0d12; }
        .logo { font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 1.5rem; color: #ff2a85; letter-spacing: 1px; }
        .btn-retour { background: transparent; border: 1px solid #ff2a85; color: #fff; padding: 8px 16px; border-radius: 6px; cursor: pointer; transition: 0.3s; font-size: 0.85rem; }
        .btn-retour:hover { background: #ff2a85; }

        .tabs { display: flex; justify-content: center; gap: 20px; padding: 20px; background: #09090d; border-bottom: 1px solid #222; }
        .tab-btn { background: none; border: none; color: #888; font-family: 'Orbitron', sans-serif; font-size: 1rem; cursor: pointer; padding: 10px 20px; border-bottom: 2px solid transparent; transition: 0.3s; }
        .tab-btn.active { color: #ff2a85; border-bottom: 2px solid #ff2a85; }

        .container { flex: 1; padding: 30px 40px; max-width: 1400px; margin: 0 auto; width: 100%; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        h2 { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; margin-bottom: 20px; color: #fff; display: flex; align-items: center; gap: 10px; }
        
        /* Grille des membres Discord */
        .grid-membres { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .card-membre { background: #13131a; border: 1px solid #252535; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        .info-membre strong { font-size: 1.1rem; color: #ff2a85; display: block; margin-bottom: 8px; }
        .roles-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; }
        .badge-role { background: #1f1f2e; border: 1px solid #33334d; font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; color: #ccc; }
        
        .actions-membre { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .actions-membre button { background: #1a1a24; border: 1px solid #333; color: #fff; padding: 6px; border-radius: 5px; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
        .actions-membre button:hover { background: #252535; border-color: #ff2a85; }

        /* Candidatures */
        .cand-card { background: #13131a; border: 1px solid #252535; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
        .cand-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .status-badge { font-size: 0.8rem; padding: 4px 10px; border-radius: 20px; font-weight: 600; }
        .status-attente { background: #ffbe0b22; color: #ffbe0b; border: 1px solid #ffbe0b55; }
        
        footer { text-align: center; padding: 20px; font-size: 0.8rem; color: #555; border-top: 1px solid #1a1a22; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🛡️ ASPENSTAFF</div>
        <button class="btn-retour" onclick="window.location.href='index.html'">Retour au site</button>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(0)">📂 Recrutement & Tickets</button>
        <button class="tab-btn" onclick="switchTab(1)">📊 Joueurs</button>
        <button class="tab-btn" onclick="switchTab(2)">👥 Membres Discord</button>
    </div>

    <div class="container">
        <div class="tab-content active" id="tab-0">
            <h2>📁 CANDIDATURES REÇUES</h2>
            <div id="containerCandidatures">
                <p style="color: #777;">Chargement des candidatures...</p>
            </div>
        </div>

        <div class="tab-content" id="tab-1">
            <h2>📊 GESTION DES JOUEURS</h2>
            <p style="color: #777;">Aucune donnée joueur pour le moment.</p>
        </div>

        <div class="tab-content" id="tab-2">
            <h2>👥 GESTION DES MEMBRES DISCORD</h2>
            <div id="containerMembres" class="grid-membres">
                <p style="color: #777;">Chargement des membres depuis le bot Discord...</p>
            </div>
        </div>
    </div>

    <footer>
        © 2026 ASPEN RP – TOUS DROITS RÉSERVÉS
    </footer>

    <script>
        function switchTab(index) {
            document.querySelectorAll('.tab-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
            document.querySelectorAll('.tab-content').forEach((content, i) => {
                content.classList.toggle('active', i === index);
            });
        }

        async function chargerMembresDiscord() {
            const container = document.getElementById('containerMembres');
            try {
                const response = await fetch('/api/citoyens');
                if (!response.ok) throw new Error("Erreur de communication avec le serveur Node.js");
                
                const membres = await response.json();
                
                if (!membres || membres.length === 0) {
                    container.innerHTML = `<p style="color: #888;">Aucun membre trouvé sur le serveur Discord.</p>`;
                    return;
                }

                let html = '';
                membres.forEach(member => {
                    let rolesHtml = member.roles && member.roles.length > 0 
                        ? member.roles.map(r => `<span class="badge-role">${escapeHtml(r)}</span>`).join(' ') 
                        : '<span class="badge-role">Aucun rôle</span>';
                    
                    html += `
                        <div class="card-membre">
                            <div class="info-membre">
                                <strong>${escapeHtml(member.name)}</strong>
                                <div class="roles-container">${rolesHtml}</div>
                            </div>
                            <div class="actions-membre">
                                <button onclick="alert('Action Promouvoir pour ${member.id}')">Promouvoir</button>
                                <button onclick="alert('Action Mute pour ${member.id}')" style="color: #ffbe0b;">Mute</button>
                                <button onclick="alert('Action Expulser pour ${member.id}')" style="color: #ff3366;">Expulser</button>
                                <button onclick="alert('Action Ban pour ${member.id}')" style="color: #d90429;">Ban</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (error) {
                console.error("Erreur chargement membres:", error);
                container.innerHTML = `<p style="color: #d90429;">Impossible de charger les membres du bot. Vérifie que ton serveur Node.js est bien démarré.</p>`;
            }
        }

        async function chargerCandidatures() {
            const container = document.getElementById('containerCandidatures');
            try {
                const response = await fetch('/api/candidatures');
                const list = await response.json();

                if (!list || list.length === 0) {
                    container.innerHTML = `<p style="color: #888;">Aucune candidature n'a été soumise pour le moment.</p>`;
                    return;
                }

                let html = '';
                list.forEach(c => {
                    html += `
                        <div class="cand-card">
                            <div class="cand-header">
                                <strong>🎮 ${escapeHtml(c.discord)}</strong>
                                <span class="status-badge status-attente">${escapeHtml(c.status || 'En attente')}</span>
                            </div>
                            <p><strong>Poste :</strong> ${escapeHtml(c.poste)}</p>
                            <p><strong>Motivations :</strong> ${escapeHtml(c.motivations || c.message || 'N/A')}</p>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = `<p style="color: #d90429;">Erreur lors du chargement des candidatures.</p>`;
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Charger les données dès l'ouverture de la page
        document.addEventListener('DOMContentLoaded', () => {
            chargerMembresDiscord();
            chargerCandidatures();
        });
    </script>
</body>
</html>
