<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aspen Staff - Gestion des Candidatures</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b090a;
            --panel-bg: #161a1d;
            --accent-pink: #f72585;
            --text-color: #ffffff;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .navbar-custom {
            background: var(--panel-bg);
            border-bottom: 2px solid var(--accent-pink);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .container-box {
            background-color: var(--panel-bg);
            border: 1px solid rgba(247, 37, 133, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin: 30px auto;
            max-width: 900px;
        }
        .candidate-card {
            background: #212529;
            border-left: 4px solid var(--accent-pink);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: #6c757d;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="navbar-custom">
        <h4 class="mb-0" style="color: var(--accent-pink); font-weight: bold;"><i class="fa-solid fa-shield"></i> ASPENSTAFF</h4>
        <a href="recrutement.html" class="btn btn-outline-light btn-sm">Retour au site</a>
    </div>

    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3><i class="fa-solid fa-folder-open"></i> CANDIDATURES REÇUES</h3>
            <button class="btn btn-outline-danger btn-sm" onclick="clearList()"><i class="fa-solid fa-trash"></i> Vider la liste</button>
        </div>

        <div class="container-box" id="candidaturesListContainer">
            </div>
    </div>

    <footer>
        <p>&copy; 2026 ASPEN RP — TOUS DROITS RÉSERVÉS</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadCandidatures();
        });

        function loadCandidatures() {
            const container = document.getElementById('candidaturesListContainer');
            let list = JSON.parse(localStorage.getItem('aspen_candidatures') || '[]');

            if (list.length === 0) {
                container.innerHTML = `<p class="text-center text-muted my-4">Aucune candidature n'a été soumise pour le moment.</p>`;
                return;
            }

            let html = '';
            list.forEach((c, index) => {
                html += `
                    <div class="candidate-card">
                        <div>
                            <h5 style="color: var(--accent-pink); margin-bottom: 5px;">${escapeHtml(c.discord)}</h5>
                            <p class="mb-1"><strong>Poste :</strong> ${escapeHtml(c.poste)}</p>
                            <p class="mb-0 text-muted" style="font-size: 0.9rem;"><strong>Motivations :</strong> ${escapeHtml(c.motivations)}</p>
                        </div>
                        <div>
                            <button class="btn btn-sm btn-primary" onclick="openTicket('${escapeHtml(c.discord)}')"><i class="fa-solid fa-comments"></i> Ouvrir le Ticket</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function openTicket(discordName) {
            let list = JSON.parse(localStorage.getItem('aspen_candidatures') || '[]');
            let candidate = list.find(c => c.discord.toLowerCase() === discordName.toLowerCase());
            if (!candidate) return;

            const container = document.getElementById('candidaturesListContainer');
            let msgsHtml = '';
            if (candidate.messages && candidate.messages.length > 0) {
                candidate.messages.forEach(m => {
                    msgsHtml += `<div style="margin: 8px 0;"><strong>${escapeHtml(m.sender)}</strong> : ${escapeHtml(m.text)}</div>`;
                });
            } else {
                msgsHtml = `Aucun message pour l'instant.`;
            }

            container.innerHTML = `
                <button class="btn btn-sm btn-secondary mb-3" onclick="loadCandidatures()"><i class="fa-solid fa-arrow-left"></i> Retour aux candidatures</button>
                <h4 class="mb-3">TICKET DE : ${escapeHtml(candidate.discord)}</h4>
                <div style="background: #0b090a; padding: 15px; border-radius: 8px; height: 250px; overflow-y: auto; margin-bottom: 15px;" id="ticketMessagesBox">
                    ${msgsHtml}
                </div>
                <div class="input-group">
                    <input type="text" id="staffReplyInput" class="form-control" placeholder="Écris ta réponse au candidat..." onkeypress="handleStaffKey(event, '${escapeHtml(candidate.discord)}')">
                    <button class="btn btn-success" onclick="sendStaffMessage('${escapeHtml(candidate.discord)}')"><i class="fa-solid fa-paper-plane"></i> Envoyer</button>
                </div>
            `;
        }

        function handleStaffKey(e, discordName) {
            if (e.key === 'Enter') sendStaffMessage(discordName);
        }

        function sendStaffMessage(discordName) {
            const input = document.getElementById('staffReplyInput');
            const text = input.value.trim();
            if (!text) return;

            let list = JSON.parse(localStorage.getItem('aspen_candidatures') || '[]');
            let candidate = list.find(c => c.discord.toLowerCase() === discordName.toLowerCase());
            if (candidate) {
                if (!candidate.messages) candidate.messages = [];
                candidate.messages.cz = true; // helper
                candidate.messages.push({
                    sender: 'Staff',
                    text: text,
                    date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                });
                localStorage.setItem('aspen_candidatures', JSON.stringify(list));
                openTicket(discordName); // Recharge le ticket actualisé
            }
        }

        function clearList() {
            if (confirm("Veux-tu vraiment vider toutes les candidatures ?")) {
                localStorage.removeItem('aspen_candidatures');
                loadCandidatures();
            }
        }

        function escapeHtml(text) {
            return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
        }
    </script>
</body>
</html>
