<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASPEN STAFF - Espace Modération & Membres</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #07070a;
            --bg-card: #0b0c14;
            --accent-pink: #f72585;
            --secondary-neon: #00f5d4;
            --purple-glow: #3b1747;
        }

        body { background-color: var(--bg-dark); color: white; font-family: 'Rajdhani', sans-serif; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        
        .header-bar { background: rgba(10, 10, 15, 0.95); border-bottom: 2px solid var(--accent-pink); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        
        .cand-card { background: var(--bg-card); border: 1px solid var(--purple-glow); border-radius: 12px; padding: 20px; margin-bottom: 20px; transition: 0.3s; }
        .cand-card:hover { border-color: var(--secondary-neon); box-shadow: 0 5px 15px rgba(0, 245, 212, 0.1); }

        .status-badge { padding: 4px 12px; border-radius: 6px; font-weight: bold; font-size: 0.85rem; text-transform: uppercase; }
        .status-En-attente { background: #ffbe0b; color: #000; }
        .status-Accepté { background: #38b000; color: #fff; }
        .status-Refusé { background: #d90429; color: #fff; }

        .nav-tabs { border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .nav-tabs .nav-link { color: #a0aec0; border: none; font-family: 'Orbitron', sans-serif; font-weight: 600; cursor: pointer; padding: 10px 20px; }
        .nav-tabs .nav-link.active { background: transparent; color: var(--secondary-neon); border-bottom: 2px solid var(--secondary-neon); }
        
        .ticket-box { background: var(--bg-card); border: 2px solid var(--accent-pink); border-radius: 12px; padding: 20px; margin-top: 20px; display: none; }
        .ticket-messages { height: 300px; overflow-y: auto; background: #07080e; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .msg-bubble { max-width: 80%; padding: 10px 14px; border-radius: 10px; font-size: 0.95rem; }
        .msg-bubble.staff { align-self: flex-end; background: var(--accent-pink); color: white; }
        .msg-bubble.user { align-self: flex-start; background: #151828; border-left: 3px solid var(--secondary-neon); color: #e2e8f0; }

        .member-avatar { width: 45px; height: 45px; border-radius: 50%; background: linear-gradient(45deg, #7209b7, var(--accent-pink)); display: flex; align-items: center; justify-content: center; font-family: 'Orbitron', sans-serif; font-weight: 700; color: white; border: 2px solid var(--secondary-neon); flex-shrink: 0; }
        .roles-container { display: flex; flex-wrap: wrap; gap: 5px; margin: 12px 0; min-height: 30px; }
        
        /* CORRECTION ICI : Fermeture de la balise .role-badge */
        .role-badge { background: rgba(88, 101, 242, 0.2); color: #c9cdfb; border: 1px solid rgba(88, 101, 242, 0.5); padding: 3px 8px; border-radius: 12px; font-size: 0.75rem; }
        
        /* Custom Scrollbar pour le style */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--purple-glow); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-pink); }
    </style>
</head>
<body>

    <div class="header-bar">
        <h2 class="font-orbitron mb-0 text-white"><i class="fa-solid fa-shield-halved me-2" style="color: var(--accent-pink);"></i> ASPEN STAFF</h2>
        <button class="btn btn-danger font-orbitron" onclick="sendUrgentAlert()"><i class="fa-solid fa-bell me-2"></i>Alerte Urgente</button>
    </div>

    <div class="container mt-4 flex-grow-1">
        <ul class="nav nav-tabs">
            <li class="nav-item">
                <a class="nav-link active" id="tab-recrutement" onclick="switchTab('recrutement')"><i class="fa-solid fa-user-plus me-2"></i>Recrutement</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="tab-annuaire" onclick="switchTab('annuaire')"><i class="fa-solid fa-address-book me-2"></i>Annuaire RP</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="tab-membres" onclick="switchTab('membres')"><i class="fa-brands fa-discord me-2"></i>Membres Discord</a>
            </li>
        </ul>

        <div id="section-recrutement">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="font-orbitron text-white"><i class="fa-solid fa-inbox me-2" style="color: var(--secondary-neon);"></i> Dossiers de Candidature</h3>
                <button class="btn btn-outline-danger btn-sm" onclick="clearAllCandidatures()"><i class="fa-solid fa-trash me-2"></i>Purger les dossiers</button>
            </div>

            <div class="row" id="candidaturesList">
                </div>

            <div id="ticketSection" class="ticket-box">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="font-orbitron mb-0">Ticket : <span id="ticketCandidateName" style="color: var(--secondary-neon);"></span></h4>
                    <button class="btn btn-secondary btn-sm" onclick="closeTicketView()"><i class="fa-solid fa-arrow-left me-1"></i> Retour</button>
                </div>
                <div class="ticket-messages" id="ticketMessagesContainer">
                    </div>
                <div class="input-group">
                    <input type="text" id="staffTicketInput" class="form-control bg-dark text-white border-secondary" placeholder="Écrire au candidat..." onkeypress="handleTicketKey(event)">
                    <button class="btn btn-primary" style="background: var(--accent-pink); border: none;" onclick="sendTicketMessage()"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>

        <div id="section-annuaire" style="display: none;">
            <h3 class="font-orbitron text-white mb-4"><i class="fa-solid fa-address-book me-2" style="color: var(--secondary-neon);"></i> Annuaire RP</h3>
            <div class="row" id="playersList">
                <div class="col-12 text-center text-muted my-5"><h5>Chargement de l'annuaire...</h5></div>
            </div>
        </div>

        <div id="section-membres" style="display: none;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="font-orbitron text-white mb-0"><i class="fa-brands fa-discord me-2" style="color: #5865F2;"></i> Liste des Membres</h3>
                <input type="text" id="searchDiscord" class="form-control w-25 bg-dark text-white border-secondary" placeholder="Rechercher un membre..." onkeyup="filterDiscordMembers()">
            </div>
            <div class="row" id="discordMembersList">
                <div class="col-12 text-center text-muted my-5"><h5>Chargement des membres...</h5></div>
            </div>
        </div>
    </div>

    <footer class="text-center py-3 mt-4" style="background: #07070a; border-top: 1px solid rgba(255,255,255,0.05); color: #6c757d; font-size: 0.9rem;">
        ASPEN RP © 2026 - Panel d'Administration
    </footer>

    <script>
        let activeTicketIndex = null;
        let currentCandDiscord = null;
        let ticketPollingInterval = null; 
        let lastMessageCount = 0; 

        document.addEventListener('DOMContentLoaded', () => {
            renderCandidatures();
            renderPlayers();
            renderDiscordMembers();
        });

        function switchTab(tab) {
            document.getElementById('tab-recrutement').classList.toggle('active', tab === 'recrutement');
            document.getElementById('tab-annuaire').classList.toggle('active', tab === 'annuaire');
            document.getElementById('tab-membres').classList.toggle('active', tab === 'membres');

            document.getElementById('section-recrutement').style.display = tab === 'recrutement' ? 'block' : 'none';
            document.getElementById('section-annuaire').style.display = tab === 'annuaire' ? 'block' : 'none';
            document.getElementById('section-membres').style.display = tab === 'membres' ? 'block' : 'none';
        }

        async function sendUrgentAlert() {
            if (!confirm("Voulez-vous envoyer une alerte urgente sur votre Discord ?")) return;
            try {
                let response = await fetch('/api/urgent-alert', { method: 'POST' });
                if (response.ok) alert("Alerte envoyée avec succès !");
                else alert("Erreur lors de l'envoi.");
            } catch (err) { alert("Erreur de connexion avec le serveur."); }
        }

        async function renderCandidatures() {
            const container = document.getElementById('candidaturesList');
            if(container.innerHTML.trim() === '') container.innerHTML = `<div class="col-12 text-center text-muted my-5"><h5>Chargement...</h5></div>`;

            try {
                let response = await fetch('/api/candidatures');
                let list = await response.json();

                if (!Array.isArray(list) || list.length === 0) {
                    container.innerHTML = `<div class="col-12 text-center text-muted my-5"><h5>Aucune candidature reçue.</h5></div>`;
                    return;
                }

                container.innerHTML = '';
                list.forEach((item) => {
                    const card = document.createElement('div');
                    card.className = 'col-md-6';
                    
                    let msgsHtml = '';
                    if(item.messages && item.messages.length > 0) {
                        let lastMsg = item.messages[item.messages.length - 1];
                        let color = lastMsg.sender === 'Staff' ? '#f72585' : '#00f5d4';
                        msgsHtml = `<div class="text-muted mb-1" style="font-size: 0.85rem;">Dernier msg: <strong style="color: ${color};">${escapeHtml(lastMsg.sender)}</strong> : ${escapeHtml(lastMsg.text)}</div>`;
                    } else {
                        msgsHtml = `<span class="text-muted" style="font-size: 0.85rem;">Aucun message.</span>`;
                    }

                    card.innerHTML = `
                        <div class="cand-card">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5 class="font-orbitron mb-0"><i class="fa-brands fa-discord me-2 text-primary"></i>${escapeHtml(item.discord)}</h5>
                                <span class="status-badge status-${(item.status || 'En-attente').replace(' ', '-')}">${escapeHtml(item.status || 'En attente')}</span>
                            </div>
                            <p class="mb-1"><strong>Poste :</strong> ${escapeHtml(item.poste)}</p>
                            <p class="mb-1 text-muted" style="font-size: 0.9rem;"><strong>Motivations :</strong> ${escapeHtml(item.motivations || 'Non précisé')}</p>
                            <div class="p-2 rounded mb-3 mt-3" style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);">
                                ${msgsHtml}
                            </div>
                            <div class="d-flex gap-2">
                                <button class="btn btn-success btn-sm flex-fill" onclick="updateStatus('${escapeHtml(item.discord)}', 'Accepté')">Accepter</button>
                                <button class="btn btn-danger btn-sm flex-fill" onclick="updateStatus('${escapeHtml(item.discord)}', 'Refusé')">Refuser</button>
                                <button class="btn btn-outline-info btn-sm flex-fill font-orbitron" onclick="openTicket('${escapeHtml(item.discord)}')"><i class="fa-solid fa-envelope me-1"></i> Ouvrir Ticket</button>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) { 
                console.error(err);
                container.innerHTML = `<div class="col-12 text-center text-danger my-5"><h5>Erreur de connexion au serveur.</h5></div>`;
            }
        }

        async function openTicket(discordName) {
            currentCandDiscord = discordName;
            document.getElementById('ticketCandidateName').innerText = discordName;
            document.getElementById('candidaturesList').style.display = 'none';
            document.getElementById('ticketSection').style.display = 'block';
            lastMessageCount = 0; 
            await renderTicketMessages();

            if (ticketPollingInterval) clearInterval(ticketPollingInterval);
            ticketPollingInterval = setInterval(renderTicketMessages, 2500);
        }

        function closeTicketView() {
            if (ticketPollingInterval) clearInterval(ticketPollingInterval);
            currentCandDiscord = null;
            document.getElementById('ticketSection').style.display = 'none';
            document.getElementById('candidaturesList').style.display = 'flex';
            renderCandidatures();
        }

        async function renderTicketMessages() {
            if (!currentCandDiscord) return;
            try {
                let response = await fetch('/api/candidatures');
                let list = await response.json();
                let candidate = list.find(c => c.discord.toLowerCase() === currentCandDiscord.toLowerCase());

                const container = document.getElementById('ticketMessagesContainer');

                if (!candidate || !candidate.messages || candidate.messages.length === 0) {
                    container.innerHTML = `<div class="text-center text-muted my-auto">Aucun message. Commence la discussion !</div>`;
                    return;
                }

                if (candidate.messages.length !== lastMessageCount) {
                    container.innerHTML = '';
                    candidate.messages.forEach(m => {
                        const bubble = document.createElement('div');
                        const isStaff = m.sender === 'Staff';
                        bubble.className = `msg-bubble ${isStaff ? 'staff' : 'user'}`;
                        bubble.innerHTML = `<div style="font-size: 0.75rem; opacity: 0.8; margin-bottom: 2px;"><strong>${escapeHtml(m.sender)}</strong></div><div>${escapeHtml(m.text)}</div>`;
                        container.appendChild(bubble);
                    });
                    container.scrollTop = container.scrollHeight; 
                    lastMessageCount = candidate.messages.length; 
                }
            } catch (e) { console.error(e); }
        }

        function handleTicketKey(e) { if (e.key === 'Enter') sendTicketMessage(); }

        async function sendTicketMessage() {
            const input = document.getElementById('staffTicketInput');
            const text = input.value.trim();
            if (!text || !currentCandDiscord) return;

            const container = document.getElementById('ticketMessagesContainer');
            container.innerHTML += `<div class="msg-bubble staff"><div style="font-size: 0.75rem; opacity: 0.8;"><strong>Staff</strong></div><div>${escapeHtml(text)}</div></div>`;
            container.scrollTop = container.scrollHeight;
            input.value = '';
            lastMessageCount++; 

            try {
                await fetch('/api/candidatures/message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ discord: currentCandDiscord, sender: 'Staff', text: text })
                });
            } catch (err) { alert("Erreur serveur."); }
        }

        async function updateStatus(discordName, newStatus) {
            try {
                await fetch('/api/candidatures/status', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ discord: discordName, status: newStatus })
                });
                renderCandidatures(); 
            } catch(e) { alert("Erreur serveur"); }
        }

        async function clearAllCandidatures() {
            if(!confirm("⚠️ Es-tu sûr de vouloir purger toutes les candidatures ? C'est irréversible !")) return;
            try {
                await fetch('/api/candidatures/clear', { method: 'DELETE' });
                renderCandidatures();
            } catch (e) { alert("Erreur lors de la purge."); }
        }

        async function renderPlayers() { 
            const container = document.getElementById('playersList');
            container.innerHTML = `<div class="col-12 text-center text-muted my-5"><h5>L'annuaire sera disponible une fois la base de données liée.</h5></div>`;
        }
        
        async function renderDiscordMembers() { 
            const container = document.getElementById('discordMembersList');
            container.innerHTML = `<div class="col-12 text-center text-muted my-5"><h5>Les membres Discord apparaîtront ici.</h5></div>`;
        }
        
        function filterDiscordMembers() { 
            // Logique de recherche à implémenter plus tard
        }

        function escapeHtml(text) { return text ? text.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }
    </script>
</body>
</html>
